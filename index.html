<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rally-X">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a9eff">
    
    <title>Rally-X Style Game</title>
    
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="powerIndicator">
                <div id="rocketCount">Rockets: ∞</div>
                <div id="activePower">Power: None</div>
            </div>
        </div>
        <div id="controls">
            <div id="joystickContainer">
                <div id="joystickBase"></div>
                <div id="joystickHandle"></div>
            </div>
            <div id="actions">
                <button id="shoot" class="action-btn">🚀</button>
                <button id="bomb" class="action-btn">💣</button>
            </div>
        </div>
        <div id="startScreen">
            <h1>Rally-X Style</h1>
            <button id="startBtn">Start Game</button>
        </div>
        <div id="gameOverScreen" style="display: none;">
            <h2>Game Over</h2>
            <div id="finalScore">Score: 0</div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
